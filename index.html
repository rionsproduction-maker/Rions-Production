<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rions Production</title>
<style>
/* ============ VARIABEL TEMA ============ */
:root{
  --accent:#a855f7;
  --accent-2:#6366f1;
  --accent-3:#ec4899;
}
html[data-theme="dark"]{
  --bg:#0a0a12;
  --card:rgba(255,255,255,.045);
  --card-solid:#14141f;
  --border:rgba(255,255,255,.10);
  --text:#f5f5f7;
  --muted:rgba(245,245,247,.55);
  --link-bg:rgba(255,255,255,.05);
  --link-bg-hover:rgba(255,255,255,.10);
  --shadow:0 24px 60px rgba(0,0,0,.55);
  --orb:.55;
}
html[data-theme="light"]{
  --bg:#eef0f8;
  --card:rgba(255,255,255,.72);
  --card-solid:#ffffff;
  --border:rgba(20,20,43,.08);
  --text:#14142b;
  --muted:rgba(20,20,43,.55);
  --link-bg:rgba(255,255,255,.85);
  --link-bg-hover:#ffffff;
  --shadow:0 24px 60px rgba(60,60,130,.14);
  --orb:.35;
}

/* ============ DASAR ============ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:36px 16px 56px;
  overflow-x:hidden;
  position:relative;
  transition:background .4s ease,color .3s ease;
  -webkit-font-smoothing:antialiased;
}

/* ============ ORB BACKGROUND ============ */
.orbs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orbs span{
  position:absolute;border-radius:50%;
  filter:blur(90px);
  opacity:var(--orb);
  transition:opacity .4s ease;
  animation:float 20s ease-in-out infinite;
}
.orbs span:nth-child(1){width:380px;height:380px;background:var(--accent);top:-120px;left:-100px}
.orbs span:nth-child(2){width:340px;height:340px;background:var(--accent-2);bottom:-120px;right:-90px;animation-delay:-7s}
.orbs span:nth-child(3){width:280px;height:280px;background:var(--accent-3);top:45%;left:60%;animation-delay:-13s}

@keyframes float{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(40px,-50px) scale(1.12)}
  66%{transform:translate(-35px,35px) scale(.92)}
}

/* ============ TOMBOL TEMA ============ */
.theme-toggle{
  position:fixed;top:20px;right:20px;z-index:20;
  width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--card);border:1px solid var(--border);
  color:var(--text);cursor:pointer;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:.25s;
}
.theme-toggle:hover{transform:rotate(20deg) scale(1.08);border-color:var(--accent)}
.theme-toggle svg{width:20px;height:20px}

/* ============ KARTU UTAMA ============ */
.card{
  position:relative;z-index:1;
  width:100%;max-width:480px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:28px;
  padding:38px 24px 26px;
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:var(--shadow);
  text-align:center;
  transition:background .4s ease,border-color .4s ease,box-shadow .4s ease;
}

/* ============ HEADER ============ */
.head{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) backwards}
.avatar-wrap{width:104px;height:104px;margin:0 auto 18px;position:relative}
.avatar-ring{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,var(--accent),var(--accent-2),var(--accent-3),var(--accent));
  animation:spin 7s linear infinite;
  box-shadow:0 0 28px -4px var(--accent);
}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar{
  position:absolute;inset:3px;
  width:calc(100% - 6px);height:calc(100% - 6px);
  border-radius:50%;object-fit:cover;
  background:var(--card-solid);
  display:block;
}
.avatar-fallback{
  display:grid;place-items:center;
  font-size:38px;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
}

.name{
  font-size:22px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:6px;
  letter-spacing:-.3px;
}
.name svg{flex-shrink:0}
.username{font-size:14px;color:var(--muted);margin-top:3px}
.bio{font-size:14px;line-height:1.6;color:var(--muted);margin-top:12px;padding:0 8px}

/* ============ SOSIAL ============ */
.socials{
  display:flex;justify-content:center;flex-wrap:wrap;
  gap:10px;margin-top:20px;
}
.social{
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--link-bg);
  border:1px solid var(--border);
  color:var(--text);
  transition:.25s cubic-bezier(.4,0,.2,1);
  animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) backwards;
}
.social svg{width:18px;height:18px}
.social:hover{
  transform:translateY(-4px) scale(1.1);
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
  box-shadow:0 10px 24px -8px var(--accent);
}

/* ============ DAFTAR LINK ============ */
.links{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.link{
  position:relative;
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;
  background:var(--link-bg);
  border:1px solid var(--border);
  border-radius:16px;
  text-decoration:none;color:inherit;
  text-align:left;
  overflow:hidden;
  transition:transform .25s cubic-bezier(.4,0,.2,1),
             background .25s ease,border-color .25s ease,box-shadow .25s ease;
  animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) backwards;
}
.link::after{
  content:"";position:absolute;top:0;left:-120%;
  width:60%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.16),transparent);
  transition:left .6s ease;
}
.link:hover::after{left:130%}
.link:hover{
  transform:translateY(-3px);
  background:var(--link-bg-hover);
  border-color:var(--accent);
  box-shadow:0 14px 32px -14px var(--accent);
}
.link:active{transform:translateY(-1px) scale(.99)}

.link-icon{
  flex-shrink:0;width:42px;height:42px;border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
}
.link-icon svg{width:20px;height:20px}

.link-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.link-title{font-size:15px;font-weight:600;letter-spacing:-.2px}
.link-sub{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.link-arrow{
  flex-shrink:0;opacity:.35;
  transition:transform .25s ease,opacity .25s ease;
}
.link-arrow svg{width:18px;height:18px;display:block}
.link:hover .link-arrow{opacity:1;transform:translate(2px,-2px)}

/* Link unggulan */
.link.featured{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:transparent;color:#fff;
  box-shadow:0 12px 30px -12px var(--accent);
}
.link.featured .link-icon{background:rgba(255,255,255,.2)}
.link.featured .link-sub{color:rgba(255,255,255,.75)}
.link.featured:hover{box-shadow:0 18px 40px -12px var(--accent)}
.link.featured .link-arrow{opacity:.8}

/* ============ AKSI BAWAH ============ */
.actions{margin-top:22px}
.btn-share{
  width:100%;
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 20px;
  font-size:14.5px;font-weight:600;font-family:inherit;
  color:var(--text);
  background:transparent;
  border:1.5px solid var(--border);
  border-radius:14px;
  cursor:pointer;
  transition:.25s cubic-bezier(.4,0,.2,1);
}
.btn-share svg{width:17px;height:17px}
.btn-share:hover{
  border-color:var(--accent);
  color:var(--accent);
  transform:translateY(-2px);
  box-shadow:0 10px 26px -12px var(--accent);
}
.btn-share:active{transform:translateY(0)}

.footer{
  font-size:12px;color:var(--muted);
  margin-top:20px;letter-spacing:.2px;
}

/* ============ TOAST ============ */
.toast{
  position:fixed;left:50%;bottom:34px;z-index:100;
  transform:translate(-50%,18px);
  background:var(--card-solid);color:var(--text);
  border:1px solid var(--border);
  padding:12px 22px;border-radius:12px;
  font-size:13.5px;font-weight:500;
  box-shadow:0 14px 40px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .3s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ ANIMASI ============ */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}

/* ============ RESPONSIF ============ */
@media (max-width:420px){
  .card{padding:30px 18px 22px;border-radius:24px}
  .avatar-wrap{width:92px;height:92px}
  .name{font-size:20px}
  .link{padding:12px 13px;gap:12px}
  .link-icon{width:38px;height:38px;border-radius:11px}
  .link-icon svg{width:18px;height:18px}
  .theme-toggle{top:14px;right:14px;width:40px;height:40px}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>

const VERIFIED = `<svg viewBox="0 0 24 24" width="18" height="18" aria-label="Terverifikasi"><circle cx="12" cy="12" r="11" fill="#3b82f6"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* =====================================================================
   3) RENDER HALAMAN
   ===================================================================== */
const card = document.getElementById('card');

function render(){
  const avatarHTML = CONFIG.avatar
    ? `<img class="avatar" id="avatarImg" src="${CONFIG.avatar}" alt="${CONFIG.name}">`
    : `<div class="avatar avatar-fallback">${CONFIG.name.charAt(0).toUpperCase()}</div>`;

  card.innerHTML = `
    <header class="head">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        ${avatarHTML}
      </div>

      <h1 class="name">${CONFIG.name}${CONFIG.verified ? VERIFIED : ''}</h1>
      <p class="username">${CONFIG.username}</p>
      ${CONFIG.bio ? `<p class="bio">${CONFIG.bio}</p>` : ''}

      <div class="socials">
        ${CONFIG.socials.map((s,i) => `
          <a class="social" href="${s.url}" target="_blank" rel="noopener"
             aria-label="${s.name}" title="${s.name}"
             style="animation-delay:${120 + i*55}ms">
            ${ICONS[s.icon] || ICONS.link}
          </a>`).join('')}
      </div>
    </header>

    <div class="links">
      ${CONFIG.links.map((l,i) => `
        <a class="link${l.featured ? ' featured' : ''}" href="${l.url}" target="_blank" rel="noopener"
           style="animation-delay:${220 + i*70}ms">
          <span class="link-icon">${ICONS[l.icon] || ICONS.link}</span>
          <span class="link-text">
            <span class="link-title">${l.title}</span>
            ${l.subtitle ? `<span class="link-sub">${l.subtitle}</span>` : ''}
          </span>
          <span class="link-arrow">${ICONS.arrow}</span>
        </a>`).join('')}
    </div>

    <div class="actions">
      <button class="btn-share" id="shareBtn">
        ${ICONS.share}<span>Bagikan Halaman Ini</span>
      </button>
    </div>

    <p class="footer">${CONFIG.footer}</p>
  `;

  /* Fallback avatar kalau gambar gagal dimuat */
  const img = document.getElementById('avatarImg');
  if (img){
    img.addEventListener('error', () => {
      const fallback = document.createElement('div');
      fallback.className = 'avatar avatar-fallback';
      fallback.textContent = CONFIG.name.charAt(0).toUpperCase();
      img.replaceWith(fallback);
    });
  }

  document.getElementById('shareBtn').addEventListener('click', sharePage);
}

/* =====================================================================
   4) FITUR SHARE
   ===================================================================== */
async function sharePage(){
  const data = {
    title: CONFIG.name,
    text: `Cek link-link dari ${CONFIG.name}`,
    url: location.href
  };
  try{
    if (navigator.share){
      await navigator.share(data);
    }else{
      await navigator.clipboard.writeText(location.href);
      showToast('✅ Link berhasil disalin!');
    }
  }catch(err){
    if (err.name !== 'AbortError'){
      /* Fallback terakhir untuk browser lama */
      const ta = document.createElement('textarea');
      ta.value = location.href;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); showToast('✅ Link berhasil disalin!'); }
      catch(e){ showToast('❌ Gagal menyalin link'); }
      ta.remove();
    }
  }
}

/* =====================================================================
   5) TOAST NOTIFIKASI
   ===================================================================== */
const toastEl = document.getElementById('toast');
let toastTimer;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

/* =====================================================================
   6) TOGGLE TEMA (GELAP / TERANG)
   ===================================================================== */
const themeBtn = document.getElementById('themeToggle');

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  themeBtn.innerHTML = theme === 'dark' ? ICONS.sun : ICONS.moon;
  try{ localStorage.setItem('linktree-theme', theme); }catch(e){}
}

themeBtn.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

/* Muat tema tersimpan, atau ikuti preferensi sistem */
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('linktree-theme'); }catch(e){}
  if (!saved){
    saved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  applyTheme(saved);
})();

/* =====================================================================
   7) JALANKAN
   ===================================================================== */
render();
</script>
